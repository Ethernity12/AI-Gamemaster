services:
    postgre:
        image: pgvector/pgvector:pg17
        container_name: gamemaster_db

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

        ports: 
            - "127.0.0.1:5432:5432"

        volumes:
            - ./persistent/postgre_data:/var/lib/postgresql/data